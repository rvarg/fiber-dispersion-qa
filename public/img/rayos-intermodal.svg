<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 280" role="img" aria-label="Rayos A y B en una fibra multimodo de índice escalonado">
  <rect width="790" height="280" rx="14" fill="#FFFFFF"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="20" y="28" font-size="13" font-style="italic" fill="#5B6B78">Esquema cualitativo (sin escala)</text>
    <rect x="70" y="54" width="540" height="46" fill="#E3EAF0"/>
    <rect x="70" y="180" width="540" height="46" fill="#E3EAF0"/>
    <rect x="70" y="100" width="540" height="80" fill="#FBEBD8"/>
    <line x1="70" y1="100" x2="610" y2="100" stroke="#9AAAB8" stroke-width="2"/>
    <line x1="70" y1="180" x2="610" y2="180" stroke="#9AAAB8" stroke-width="2"/>
    <text x="622" y="82" font-size="13" fill="#5B6B78">Revestimiento (n₂)</text>
    <text x="622" y="145" font-size="13" fill="#16232E">Núcleo (n₁ &gt; n₂)</text>
    <text x="622" y="210" font-size="13" fill="#5B6B78">Revestimiento (n₂)</text>
    <line x1="30" y1="140" x2="64" y2="140" stroke="#16232E" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="26" y="130" font-size="12.5" fill="#16232E">Entrada</text>
    <line x1="70" y1="140" x2="610" y2="140" stroke="#0B2A4A" stroke-width="3.5" stroke-linecap="round"/>
    <polyline fill="none" stroke="#12897F" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" points="70.0,140.0 150.0,100.0 310.0,180.0 470.0,100.0 610.0,170.0"/>
    <circle cx="490" cy="140" r="14" fill="#E8963B"/><text x="490" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2A4A" font-family="Arial, Helvetica, sans-serif">A</text>
    <circle cx="190" cy="120" r="14" fill="#E8963B"/><text x="190" y="126" text-anchor="middle" font-size="17" font-weight="700" fill="#0B2A4A" font-family="Arial, Helvetica, sans-serif">B</text>
    <text x="540" y="262" font-size="13" fill="#16232E">Salida →</text>
  </g>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16232E"/></marker></defs>
